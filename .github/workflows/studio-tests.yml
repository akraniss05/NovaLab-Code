name: Academy smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'site/academy-v21.js'
      - 'site/academy-progress-sync.js'
      - 'site/academy-curriculum.js'
      - 'site/academy-i18n.js'
      - 'site/academy-effects.js'
      - 'site/academy-effects.css'
      - 'tests/effects-browser.cjs'
      - 'tests/i18n-browser.cjs'
      - 'site/academy-atelier.css'
      - 'site/academy-v31-layout.css'
      - 'supabase/functions/admin-users/index.ts'
      - 'site/academy-runtime.js'
      - 'scripts/fetch-java-runtime.sh'
      - 'site/academy-learning-sync.js'
      - 'site/academy-learning-extras.css'
      - 'site/practice-engine.js'
      - 'tests/academy-audit.cjs'
      - 'tests/progress-reliability.cjs'
      - 'tests/progress-sync.cjs'
      - 'tests/practice.cjs'
      - 'tests/runtime-browser.cjs'
      - 'tests/runtime-grading.cjs'
      - 'tests/simple-academy.cjs'
      - 'tests/support-submit.cjs'
      - 'tests/registration-v21.cjs'
      - 'tests/support-conversations.cjs'
      - 'supabase/data/v49_support_conversations.sql'
      - 'supabase/data/v47_contextual_quizzes.sql'
      - 'tests/subscription-countdown.cjs'
      - 'tests/admin-self.cjs'
      - 'tests/shop-tiers.cjs'
      - 'tests/admin-plans.cjs'
      - 'tests/xp-rewards.cjs'
      - 'supabase/migrations/20261107_v44_one_time_xp_ledger.sql'
      - 'tests/learning-sync.cjs'
      - '.github/workflows/studio-tests.yml'
  pull_request:
    paths:
      - 'site/academy-v21.js'
      - 'site/academy-progress-sync.js'
      - 'site/academy-curriculum.js'
      - 'site/academy-i18n.js'
      - 'site/academy-effects.js'
      - 'site/academy-effects.css'
      - 'tests/effects-browser.cjs'
      - 'tests/i18n-browser.cjs'
      - 'site/academy-atelier.css'
      - 'site/academy-v31-layout.css'
      - 'supabase/functions/admin-users/index.ts'
      - 'site/academy-runtime.js'
      - 'scripts/fetch-java-runtime.sh'
      - 'site/academy-learning-sync.js'
      - 'site/academy-learning-extras.css'
      - 'site/practice-engine.js'
      - 'tests/academy-audit.cjs'
      - 'tests/progress-reliability.cjs'
      - 'tests/progress-sync.cjs'
      - 'tests/practice.cjs'
      - 'tests/runtime-browser.cjs'
      - 'tests/runtime-grading.cjs'
      - 'tests/simple-academy.cjs'
      - 'tests/support-submit.cjs'
      - 'tests/registration-v21.cjs'
      - 'tests/support-conversations.cjs'
      - 'supabase/data/v49_support_conversations.sql'
      - 'supabase/data/v47_contextual_quizzes.sql'
      - 'tests/subscription-countdown.cjs'
      - 'tests/shop-tiers.cjs'
      - 'tests/admin-plans.cjs'
      - 'tests/xp-rewards.cjs'
      - 'supabase/migrations/20261107_v44_one_time_xp_ledger.sql'
      - 'tests/learning-sync.cjs'
      - '.github/workflows/studio-tests.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check site/academy-v21.js
          node --check site/academy-progress-sync.js
          node --check site/academy-curriculum.js
          node --check site/academy-i18n.js
          node --check site/academy-effects.js
          node --check site/academy-runtime.js
          node --check site/academy-learning-sync.js
          node --check site/practice-engine.js
      - name: Simple Academy and timer regression tests
        run: node tests/simple-academy.cjs
      - name: Two-way member and admin ticket conversations
        run: node tests/support-conversations.cjs
      - name: Support ticket sending and receipt regression
        run: node tests/support-submit.cjs
      - name: Subscription Edge Function security regression
        run: node tests/admin-plans.cjs
      - name: One-time XP and reward history regression
        run: node tests/xp-rewards.cjs
      - name: Exact subscription countdown and NovaLab banner
        run: node tests/subscription-countdown.cjs
      - name: Admin self XP, streak and membership controls
        run: node tests/admin-self.cjs
      - name: Four tier pricing and discounts
        run: node tests/shop-tiers.cjs
      - name: Seven-character registration contract
        run: node tests/registration-v21.cjs
      - name: Academy audit regression suite
        run: node tests/academy-audit.cjs
      - name: Existing practice tests
        run: node tests/practice.cjs
      - name: Real runtime grading tests
        run: node tests/runtime-grading.cjs
      - name: Concurrent progress sync and conflict-safe resets
        run: node tests/progress-sync.cjs
      - name: Progress reliability and queued writes
        run: node tests/progress-reliability.cjs
      - name: Account draft autosave tests
        run: node tests/learning-sync.cjs
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.56.1 fengari-web@0.1.4 pyodide@0.27.8 sql.js@1.13.0 typescript@5.9.3
      - name: Prepare local Lua runtime
        run: |
          mkdir -p site/vendor
          cp node_modules/fengari-web/dist/fengari-web.bundle.js site/vendor/fengari-web.bundle.js
          test -s site/vendor/fengari-web.bundle.js
          mkdir -p site/vendor/sql
          cp node_modules/sql.js/dist/sql-wasm.{js,wasm} site/vendor/sql/
          cp node_modules/typescript/lib/typescript.js site/vendor/typescript.js
          bash scripts/fetch-java-runtime.sh
      - name: Prepare Python WebAssembly runtime
        run: |
          mkdir -p site/vendor/pyodide
          cp -R node_modules/pyodide/. site/vendor/pyodide/
          test -s site/vendor/pyodide/pyodide.js
          test -s site/vendor/pyodide/pyodide.asm.wasm
          test -s site/vendor/pyodide/python_stdlib.zip
      - name: DE/EN browser translation and responsive toggle regression
        run: node tests/i18n-browser.cjs
      - name: Button audio, ambient motion and tap effects regression
        run: node tests/effects-browser.cjs
      - name: Check real browser runtimes
        run: node tests/runtime-browser.cjs
