name: NovaLab Code — Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/novalab-code-desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Windows-App-Icon aus bestehendem NovaLab-Logo erzeugen
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0
          python desktop/scripts/make_icon.py
      - name: Dependencies installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: App-Quellcode überprüfen
        working-directory: desktop
        run: npm run check
      - name: Windows-App und Installer bauen
        working-directory: desktop
        run: npm run build:win
      - name: Launcher-kompatibles ZIP und SHA256-Manifest erstellen
        run: python desktop/scripts/package-build.py 1.0.0
      - name: Spielbare App in ZIP vollständig prüfen
        shell: bash
        run: |
          python -c "import json,pathlib,zipfile,hashlib;p=pathlib.Path('desktop/dist/NovaLab-Code-win-x64-v1.0.0.zip');m=json.loads(pathlib.Path('desktop/dist/launcher-manifest.json').read_text());z=zipfile.ZipFile(p);assert z.testzip() is None;assert 'NovaLab Code.exe' in z.namelist();assert 'resources/site/index.html' in z.namelist();assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256'];print('ZIP, bundled site, EXE and SHA256 verified')"
      - name: Release veröffentlichen (expliziter Commit-Marker)
        if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-code]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s desktop/dist/NovaLab-Code-win-x64-v1.0.0.zip
          test -s desktop/dist/NovaLab-Code-Setup-1.0.0.exe
          gh release create code-v1.0.0 desktop/dist/NovaLab-Code-win-x64-v1.0.0.zip desktop/dist/NovaLab-Code-Setup-1.0.0.exe desktop/dist/launcher-manifest.json desktop/dist/NovaLab-Code-win-x64-v1.0.0.zip.sha256 --target "$GITHUB_SHA" --title "NovaLab Code Desktop 1.0.0 Early Access" --notes "Echte, gebündelte NovaLab-Code-Lernplattform als Desktop-App. Windows 64-bit. Online-Anbindung für Supabase erforderlich. Vorläufig unsigniert; interaktiver Windows-E2E-Test ausstehend."
      - name: Windows Preview-Artefakte
        uses: actions/upload-artifact@v4
        with:
          name: NovaLab-Code-Windows-Preview
          path: |
            desktop/dist/NovaLab-Code-win-x64-v1.0.0.zip
            desktop/dist/launcher-manifest.json
            desktop/dist/NovaLab-Code-Setup-1.0.0.exe
          if-no-files-found: error
