name: Deploy LiveryLab Academy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check private academy build
        run: |
          for f in site/config.js site/lua-mini.js site/design-lab.js site/app.js site/service-worker.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const config=fs.readFileSync('site/config.js','utf8');
          const js=fs.readFileSync('site/app.js','utf8');
          if(!config.includes('requireLogin: true'))throw Error('Login is not required');
          if(!config.includes('sb_publishable_'))throw Error('Missing public key');
          if(!js.includes("from('academy_curriculum')"))throw Error('Curriculum must come from authenticated database');
          if(fs.existsSync('site/data.js')||fs.existsSync('site/data.json'))throw Error('Public curriculum files exist');
          if(html.includes('data.js'))throw Error('Public data.js reference found');
          if(/sb_secret_[A-Za-z0-9]/.test(config))throw Error('Secret in public config');
          for(const file of ['site/index.html','site/styles.css','site/assets/liverylab-hero.jpg','site/privacy.html','site/manifest.webmanifest'])if(!fs.existsSync(file))throw Error('Missing '+file);
          console.log('Private curriculum loader and public assets validated');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
