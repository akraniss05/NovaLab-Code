name: Deploy LiveryLab Academy v14 • access approvals and references
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          node --check site/reference-data.js
          node --check site/academy.js
          node --check site/auth-mfa-v5.js
          node --check site/config.js
          node tests/smoke.cjs
          node tests/render.cjs
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.56.1
      - name: Validate mobile layouts in Chrome
        run: node tests/browser.cjs
      - name: Upload visual test captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-v14-mobile-captures
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - uses: actions/deploy-pages@v4
