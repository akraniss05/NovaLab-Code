name: Deploy LiveryLab Academy 5.0
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and private curriculum design
        run: |
          set -e
          for f in site/config.js site/lua-mini.js site/plans-v5.js site/videos-v5.js site/music-studio.js site/music-v5.js site/code-studio.js site/studio3d-v5.js site/games-v5.js site/app.js site/service-worker.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('node:fs'),html=fs.readFileSync('site/index.html','utf8'),app=fs.readFileSync('site/app.js','utf8'),conf=fs.readFileSync('site/config.js','utf8');
          for(const f of ['site/index.html','site/styles.css','site/studio-v4.css','site/studio-v5.css','site/plans-v5.js','site/videos-v5.js','site/music-studio.js','site/music-v5.js','site/code-studio.js','site/studio3d-v5.js','site/games-v5.js','site/assets/category-code.svg','site/assets/category-music.svg','site/assets/category-fivem.svg','site/assets/category-blender.svg','site/assets/category-games.svg','site/manifest.webmanifest','site/privacy.html','site/assets/icon.svg'])if(!fs.existsSync(f))throw Error('Missing '+f);
          if(!conf.includes('requireLogin: true'))throw Error('Authentication required');
          if(!conf.includes('sb_publishable_'))throw Error('Missing public publishable key');
          if(!app.includes("from('academy_curriculum')"))throw Error('Private curriculum is not used');
          if(!app.includes("window.LLMusic.renderLesson"))throw Error('Music lesson integration absent');
          if(!app.includes("window.LLIDE.render"))throw Error('Code IDE integration absent');
          if(!app.includes("academy_claim_daily"))throw Error('Reward integration absent');
          if(!html.includes('music-studio.js')||!html.includes('code-studio.js')||!html.includes('studio-v4.css'))throw Error('Missing UI module refs');
          if(html.includes('design-lab.js'))throw Error('Legacy design module still loaded');
          if(!html.includes('type="importmap"')||!html.includes('studio3d-v5.js'))throw Error('3D module mapping missing');
          if(!app.includes('roadmapsView')||!app.includes('window.LLPro'))throw Error('Roadmaps or Pro integration missing');
          const vm=require('node:vm'),context={window:{},document:{},console};
          for(const f of ['site/plans-v5.js','site/videos-v5.js','site/music-studio.js','site/music-v5.js','site/code-studio.js','site/studio3d-v5.js','site/games-v5.js']){
            vm.runInNewContext(fs.readFileSync(f,'utf8'),context,{timeout:2000,filename:f});
          }
          if(typeof context.window.LL3D.render!=='function'||typeof context.window.LLMusic.renderStudio!=='function'||typeof context.window.LLGames.render!=='function'||typeof context.window.LLIDE.render!=='function')throw Error('Studio modules failed to initialize');
          const v=context.window.LLVideo.suggest({lang:'javascript',title:'Arrays'},{category:'Sprachen'});
          if(v.id!=='Zi-Q0t4gMC8'||v.start<100)throw Error('Video selection incorrect');
          if(fs.existsSync('site/data.js')||fs.existsSync('site/data.json'))throw Error('Public curriculum files must not be deployed');
          if(/sb_secret_[A-Za-z0-9]/.test(conf))throw Error('Unsafe secret exposed');
          console.log('LiveryLab Academy 5.0 static checks passed');
          NODE
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Allow artifact indexing
        run: sleep 10
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
