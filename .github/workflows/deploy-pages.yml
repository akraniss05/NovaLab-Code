name: LiveryLab Academy Build and Deploy
on:
  push:
    branches: [main, academy-v4-staging]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and structure
        run: |
          for f in site/config.js site/lua-mini.js site/music-studio.js site/code-studio.js site/app.js site/service-worker.js; do
            node --check "$f"
          done
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const config=fs.readFileSync('site/config.js','utf8');
          const required=['site/index.html','site/styles.css','site/v4.css','site/config.js','site/lua-mini.js','site/music-studio.js','site/code-studio.js','site/app.js','site/service-worker.js','site/assets/liverylab-hero.jpg','site/privacy.html','site/manifest.webmanifest'];
          for(const f of required)if(!fs.existsSync(f))throw Error('Missing '+f);
          for(const f of ['data.js','data.json','design-lab.js'])if(fs.existsSync('site/'+f))throw Error('Legacy public asset '+f);
          for(const f of ['music-studio.js','code-studio.js','v4.css'])if(!html.includes(f))throw Error('Missing reference '+f);
          if(html.includes('Design Lab')||html.includes('data-go="design"'))throw Error('Old design menu');
          if(!config.includes('requireLogin: true'))throw Error('Login disabled');
          if(!app.includes("from('academy_curriculum')"))throw Error('Missing protected course loader');
          for(const item of ['passwordChangeGate','leaderboardView','homeV4'])if(!app.includes(item))throw Error('Missing '+item);
          if(/sb_secret_[a-zA-Z0-9]+/.test(config))throw Error('Secret in public config');
          console.log('Academy 4 build checks passed');
          NODE
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
