name: Deploy LiveryLab Academy 8.0
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and private curriculum design
        run: |
          set -e
          for f in site/config.js site/lua-mini.js site/plans-v5.js site/videos-v5.js site/music-studio.js site/music-v5.js site/code-studio.js site/studio3d-v5.js site/games-v5.js site/shell-v5.js site/auth-mfa-v5.js site/video-lab-v5.js site/workspace-v6.js site/social-v7.js site/app.js site/service-worker.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('node:fs'),html=fs.readFileSync('site/index.html','utf8'),app=fs.readFileSync('site/app.js','utf8'),conf=fs.readFileSync('site/config.js','utf8');
          for(const f of ['site/index.html','site/styles.css','site/studio-v4.css','site/studio-v5.css','site/shell-v5.css','site/studio-polish-v5.css','site/workspace-v6.css','site/workspace-v6.js','site/academy-v7.css','site/shop-inspired-v8.css','site/assets/liverylab-academy-wordmark.svg','site/assets/liverylab-server-banner.webp','site/social-v7.js','site/shell-v5.js','site/auth-mfa-v5.js','site/video-lab-v5.js','site/plans-v5.js','site/videos-v5.js','site/music-studio.js','site/music-v5.js','site/code-studio.js','site/studio3d-v5.js','site/games-v5.js','site/shell-v5.js','site/auth-mfa-v5.js','site/video-lab-v5.js','site/assets/category-code.svg','site/assets/category-music.svg','site/assets/category-fivem.svg','site/assets/category-blender.svg','site/assets/category-games.svg','site/manifest.webmanifest','site/privacy.html','site/assets/icon.svg'])if(!fs.existsSync(f))throw Error('Missing '+f);
          if(!conf.includes('requireLogin: true'))throw Error('Authentication required');
          if(!conf.includes('sb_publishable_'))throw Error('Missing public publishable key');
          if(!app.includes("from('academy_curriculum')"))throw Error('Private curriculum is not used');
          if(!app.includes("window.LLMusic.renderLesson"))throw Error('Music lesson integration absent');
          if(!app.includes("window.LLIDE.render"))throw Error('Code IDE integration absent');
          if(!app.includes("academy_claim_daily"))throw Error('Reward integration absent');
          if(!html.includes('music-studio.js')||!html.includes('code-studio.js')||!html.includes('studio-v4.css'))throw Error('Missing UI module refs');
          if(html.includes('design-lab.js'))throw Error('Legacy design module still loaded');
          if(!html.includes('type="importmap"')||!html.includes('studio3d-v5.js'))throw Error('3D module mapping missing');
          if(!html.includes('workspace-v6.js')||!html.includes('workspace-v6.css'))throw Error('Workspace 6 assets missing');if(!html.includes('academy-v7.css')||!html.includes('social-v7.js'))throw Error('Academy 7 assets missing');
          if(!html.includes('shop-inspired-v8.css')||!html.includes('liverylab-academy-wordmark.svg'))throw Error('Shop-inspired 8.0 assets missing');
          if(fs.statSync('site/assets/liverylab-server-banner.webp').size<1000)throw Error('Original LiveryLab banner file missing');
          if(!html.includes('ll-menu-button')||!html.includes('data-go="settings"')||!html.includes('auth-mfa-v5.js')||!html.includes('video-lab-v5.js'))throw Error('New shell and MFA integration missing');
          if(!app.includes('window.LLMFA.refresh')||!app.includes('window.LLVideoLab.render'))throw Error('New account or video routes missing');
          if(!app.includes('roadmapsView')||!app.includes('window.LLPro'))throw Error('Roadmaps or Pro integration missing');
          const vm=require('node:vm'),context={window:{},document:{},console};
          const scripts=Array.from(html.matchAll(/<script\s+src="([\w.-]+\.js)"/g),match=>'site/'+match[1]);
          for(const f of scripts.filter(file=>file!=='site/app.js')){
            vm.runInNewContext(fs.readFileSync(f,'utf8'),context,{timeout:2000,filename:f});
          }
          if(typeof context.window.LL3D.render!=='function'||typeof context.window.LLMusic.renderStudio!=='function'||typeof context.window.LLGames.render!=='function'||typeof context.window.LLIDE.render!=='function'||typeof context.window.LLShell.renderSettings!=='function'||typeof context.window.LLMFA.renderGate!=='function'||typeof context.window.LLVideoLab.render!=='function')throw Error('Studio modules failed to initialize');
          const v=context.window.LLVideo.suggest({lang:'javascript',title:'Arrays'},{category:'Sprachen'});
          if(v.id!=='Zi-Q0t4gMC8'||v.start<100)throw Error('Video selection incorrect');
          if(fs.existsSync('site/data.js')||fs.existsSync('site/data.json'))throw Error('Public curriculum files must not be deployed');
          if(/sb_secret_[A-Za-z0-9]/.test(conf))throw Error('Unsafe secret exposed');
          console.log('LiveryLab Academy 8.0 static checks passed');
          NODE
      - name: Test studios in Chromium and mobile WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/academy-qa" --no-audit --no-fund playwright@1.56.1 three@0.180.0 codemirror@5.65.20 jszip@3.10.1
          "$RUNNER_TEMP/academy-qa/node_modules/.bin/playwright" install --with-deps chromium webkit
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -loglevel error -f lavfi -i color=c=blue:s=320x240:d=2 -f lavfi -i sine=duration=2 -c:v libx264 -pix_fmt yuv420p -c:a aac "$RUNNER_TEMP/academy-clip.mp4"
          ffmpeg -loglevel error -i "$RUNNER_TEMP/academy-clip.mp4" -c:v libvpx -c:a libopus "$RUNNER_TEMP/academy-clip.webm"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory site &
          trap 'kill $!' EXIT
          NODE_PATH="$RUNNER_TEMP/academy-qa/node_modules" QA_CLIP="$RUNNER_TEMP/academy-clip.mp4" node tests/browser.cjs
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Allow artifact indexing
        run: sleep 10
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
