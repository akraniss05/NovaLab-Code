name: Deploy NovaLab Academy v31 • learning and community tools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Verify official NovaLab Academy brand assets
        run: |
          test -s site/novalab-banner.webp
          test -s site/novalab-logo.webp
          test -s site/novalab-icon-192.webp
          test -s site/novalab-icon-512.webp
          test -s site/novalab-icon-180.png
          echo '8fc50a162fdac0e2cf5194f51131eaa0a56f0f2efb16fd01c4bf036be41a55b4  site/novalab-banner.webp' | sha256sum -c -
          echo 'd8e7b5baf692f2f5ce2b72d3278a793d9fdb0e54b50f38053f68aea38d437520  site/novalab-logo.webp' | sha256sum -c -
          rm -rf site/banner-src
      - name: Validate sources
        run: |
          node --check site/reference-data.js
          node --check site/academy.js
          node --check site/academy-v21.js
          node --check site/academy-curriculum.js
          node --check site/academy-i18n.js
          node --check site/academy-effects.js
          node --check site/academy-studio.js
          node --check site/academy-runtime.js
          node --check site/auth-mfa-v15.js
          node --check site/config.js
          node tests/smoke.cjs
          node tests/practice.cjs
          node tests/simple-academy.cjs
          node tests/support-submit.cjs
          node tests/support-conversations.cjs
          node tests/subscription-countdown.cjs
          node tests/admin-self.cjs
          node tests/shop-tiers.cjs
          node tests/admin-plans.cjs
          node tests/xp-rewards.cjs
          node tests/render.cjs
          node tests/registration.cjs
          node tests/registration-v21.cjs
          node tests/streak.cjs
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.56.1 fengari-web@0.1.4 pyodide@0.27.8
      - name: Prepare local Lua runtime
        run: |
          mkdir -p site/vendor
          cp node_modules/fengari-web/dist/fengari-web.bundle.js site/vendor/fengari-web.bundle.js
          test -s site/vendor/fengari-web.bundle.js
      - name: Prepare Python WebAssembly runtime
        run: |
          mkdir -p site/vendor/pyodide
          cp -R node_modules/pyodide/. site/vendor/pyodide/
          test -s site/vendor/pyodide/pyodide.js
          test -s site/vendor/pyodide/pyodide.asm.wasm
          test -s site/vendor/pyodide/python_stdlib.zip
      - name: Validate language switch, state persistence and mobile header
        run: node tests/i18n-browser.cjs
      - name: Validate button effects, click sound preferences and reduced motion
        run: node tests/effects-browser.cjs
      - name: Validate mobile layouts in Chrome
        run: node tests/browser.cjs
      - name: Test real logged-in Daily Streak popup and claim
        run: node tests/login-browser.cjs
      - name: Validate authenticator setup, login and removal
        run: node tests/mfa-browser.cjs
      - name: Upload visual test captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novalab-v31-mobile-captures
          path: test-results/
          if-no-files-found: ignore
      - name: Configure NovaLab Control support link
        env:
          CONTROL_URL: ${{ vars.NOVALAB_CONTROL_URL }}
          CONTROL_GUILD: ${{ vars.NOVALAB_CONTROL_GUILD_ID }}
        run: node control/scripts/configure-pages.mjs
      - name: Remove restricted reference data from public site artifact
        run: rm -f site/reference-data.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - uses: actions/deploy-pages@v4
