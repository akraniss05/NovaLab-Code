name: NovaLab Control
on:
  pull_request:
    paths: ["control/**", ".github/workflows/novalab-control.yml"]
  push:
    branches: [main]
    paths: ["control/**", ".github/workflows/novalab-control.yml"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: novalab
          POSTGRES_USER: novalab
          POSTGRES_PASSWORD: tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novalab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://novalab:tests@localhost:5432/novalab
      TEST_DATABASE: "1"
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm run check
