services:
  novalab-control:
    build: .
    image: novalab-control:local
    container_name: novalab-control
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      DATA_FILE: "/app/data/control.json"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - novalab-control-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
volumes:
  novalab-control-data:
